name: network

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in the repository root .env}
    networks:
      - tunnel

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: homelab
    restart: unless-stopped
    network_mode: host
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?Set TS_AUTHKEY in the repository root .env}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN

networks:
  tunnel:
    name: cloudflare-tunnel

volumes:
  tailscale-state:
