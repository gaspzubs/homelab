services:
  ## Administration ##
  # --- Docker manager (Portainer) ---
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${ROOT_DIR}/portainer/portainer_data:/data
    ports:
      - "9000:9000"

  # --- Home page (Homer) ---
  homer:
    image: b4bz/homer
    container_name: homer
    restart: unless-stopped
    volumes:
      - ${ROOT_DIR}/homer/assets:/www/assets
    ports:
      - "80:8080" # Homer uses port 80 (HTTP standard)
    user: "${PUID}:${PGID}" # Replace with your local user ID
    networks:
      - default
      - tunnel

  # --- Monitoring (Glances) ---
  glances:
    image: nicolargo/glances:latest
    container_name: glances
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - GLANCES_OPT=-w
      - TZ=${TZ}
    ports:
      - "61208:61208"

  # --- Smart home (Home Assistant) ---
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host # Required for local device discovery (mDNS/SSDP)
    environment:
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${ROOT_DIR}/homeassistant:/config

  # --- Ad blocker (AdGuard Home) ---
  adguardhome:
    image: adguard/adguardhome
    container_name: adguardhome
    restart: unless-stopped
    ports:
      - "53:53/tcp" # DNS
      - "53:53/udp" # DNS
      - "3000:80/tcp" # Installation web interface (port 3000 to avoid conflict with Homer)
      - "3001:3000/tcp" # Security
    volumes:
      - ${ROOT_DIR}/adguard/adguard_work:/opt/adguardhome/work
      - ${ROOT_DIR}/adguard/adguard_conf:/opt/adguardhome/conf

  # --- Media (Jellyfin) ---
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    # network_mode: host # Optional: useful for DLNA, but uses the host's ports
    ports:
      - "8096:8096"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${ROOT_DIR}/jellyfin/jellyfin_config:/config
      - ${ROOT_DIR}/jellyfin/jellyfin_cache:/cache
      - ${MEDIA_DIR}/media:/media # Map the NAS mount to the container's /media directory
    devices:
      - /dev/dri:/dev/dri # Enable Intel CPU hardware acceleration
    networks:
      - default
      - tunnel

# --- DVD playback (MakeMKV) ---
#  makemkv-stream:
#    image: jlesage/makemkv:latest
#    container_name: makemkv-stream
#    restart: unless-stopped
#    environment:
#      - USER_ID=${PUID}
#      - GROUP_ID=${PGID}
#      - TZ=${TZ}
#      - AUTOMATED_CONVERSION=0
#    devices:
#      - /dev/sr0:/dev/sr0
#      - /dev/sg1:/dev/sg1  # Generic SCSI device required by MakeMKV for disc access

#    volumes:
#      - ${ROOT_DIR}/makemkv/config:/config:rw
#      - ${MEDIA_DIR}/media/films:/output:rw  # Where your ripped MKV files will be saved
#    ports:
#      - "5800:5800"    # Web UI port to access MakeMKV graphically
#      - "51000:51000/tcp"

  # --- Automatic disc ripping (ARM) ---
  # Create the container once while it is stopped using:
  # docker compose --profile ripping create arm
  # Start/stop it afterward from Portainer's Containers page.
  arm:
    image: automaticrippingmachine/automatic-ripping-machine:latest
    container_name: arm
    profiles:
      - ripping
    restart: unless-stopped
    privileged: true
    environment:
      ARM_UID: "${PUID}"
      ARM_GID: "${PGID}"
      TZ: "${TZ}"
    volumes:
      - ${ROOT_DIR}/arm:/home/arm
      - ${ROOT_DIR}/arm/music:/home/arm/music
      - ${ROOT_DIR}/arm/logs:/home/arm/logs
      - ${MEDIA_DIR}/media:/home/arm/media
      - ${ROOT_DIR}/arm/config:/etc/arm/config
    devices:
      - /dev/sr0:/dev/sr0
    ports:
      - "8081:8080"

  # --- Navidrome ---
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    user: 1000:1000 # should be owner of volumes
    ports:
      - "4533:4533"
    restart: unless-stopped
    environment:
      # Optional: put your config options customization here. Examples:
      # ND_LOGLEVEL: debug
      ND_BASEURL: "https://navidrome.mdubonheur.org"
    volumes:
      - "${ROOT_DIR}/navidrome/data:/data"
      - "${MEDIA_DIR}/Music:/music:ro"
    networks:
      - default
      - tunnel

  # --- Automatic updates (Watchtower) ---
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock


  ## MUSIC ##
  # --- Music manager (Lidarr) ---
  lidarr:
    image: ghcr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=002
    volumes:
      - ${ROOT_DIR}/lidarr/config:/config
      - ${MEDIA_DIR}:/data
      - ${MEDIA_DIR}/torrents/slskd/downloads:/downloads
    ports:
      - "8686:8686"
    networks:
      - default
      - tunnel

  # --- Movie manager (Radarr) ---
  radarr:
    image: ghcr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=002
    volumes:
      - ${ROOT_DIR}/radarr/config:/config
      - ${MEDIA_DIR}:/data
    ports:
      - "7878:7878"

  # --- TV series manager (Sonarr) ---
  sonarr:
    image: ghcr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=002
    volumes:
      - ${ROOT_DIR}/sonarr/config:/config
      - ${MEDIA_DIR}:/data
    ports:
      - "8989:8989"

  # --- Subtitle manager (Bazarr) ---
  bazarr:
    image: ghcr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=002
    volumes:
      - ${ROOT_DIR}/bazarr/config:/config
      - ${MEDIA_DIR}:/data
    ports:
      - "6767:6767"

  # --- Indexer manager (Prowlarr) ---
  prowlarr:
    image: ghcr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${ROOT_DIR}/prowlarr/config:/config
    ports:
      - "9696:9696"

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Paris
    ports:
      - "8191:8191"
    restart: unless-stopped

  # --- BitTorrent client (qBittorrent) ---
  qbittorrent:
    image: ghcr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
      - UMASK=002
    volumes:
      - ${ROOT_DIR}/qbittorrent/config:/config
      - ${MEDIA_DIR}:/data
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"

  # --- Soulseek slskd ---
  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    restart: unless-stopped
    environment:
      # Enable remote configuration and external login if needed
      - SLSKD_REMOTE_CONFIGURATION=true
      # Set the username/password in .env
      - SLSKD_SHARED_DIR=/music
      - SLSKD_SLSK_USERNAME=${SOULSEEK_USER}
      - SLSKD_SLSK_PASSWORD=${SOULSEEK_PASS}
    ports:
      - "5030:5030/tcp"   # Main TCP port
      - "5031:5031/tcp"   # Secondary TCP port
      - "50300:50300/tcp" # TCP data port
    volumes:
      - ${ROOT_DIR}/slskd:/app:rw      # slskd configuration and internal files
      - ${MEDIA_DIR}/torrents/slskd:/data:rw # Directory for downloading files
      - ${MEDIA_DIR}/Music:/music:rw  # Directory for downloading and sharing music
    user: 1000:1000   # UID:GID for your Ubuntu user
    networks:
      - default
      - tunnel

  # --- Soularr ---
  soularr:
    image: mrusse08/soularr:latest
    container_name: soularr
    depends_on:
      - lidarr
      - slskd
    user: 1000:1000 # this should be set to your UID and GID
    environment:
      - TZ=${TZ}
      - SCRIPT_INTERVAL=300 # Script interval in seconds
    volumes:
      - ${MEDIA_DIR}/torrents/slskd/downloads:/downloads
      # Select where you are storing your config file.
      # Leave "/data" since thats where the script expects the config file to be
      - ${ROOT_DIR}/soularr:/data
    restart: unless-stopped

  # --- Feishin ---
  feishin:
    image: ghcr.io/jeffvli/feishin:latest
    container_name: feishin
    environment:
      - SERVER_NAME=navidrome # pre-defined server name
      - SERVER_LOCK=true # When true AND name/type/url are set, only username/password can be toggled
      - SERVER_TYPE=navidrome
      - SERVER_URL=${NAVIDROME_SERVER_URL}
      - REMOTE_URL=${NAVIDROME_REMOTE_URL}
      - LEGACY_AUTHENTICATION=false # When SERVER_LOCK is true, sets the legacy (plaintext) authentication flag for Subsonic/OpenSubsonic servers
      - ANALYTICS_DISABLED=true # Set to true to disable Umami analytics tracking
    ports:
      - "9180:9180"
    volumes:
      - ${ROOT_DIR}/feishin:/root/.config/feishin
    restart: unless-stopped
    networks:
      - default
      - tunnel

networks:
  tunnel:
    name: cloudflare-tunnel
    external: true
